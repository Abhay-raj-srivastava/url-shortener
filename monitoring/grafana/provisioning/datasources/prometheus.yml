# =============================================================
#  Grafana — Prometheus datasource auto-provisioning
#  Grafana loads this file on startup so you never need to
#  configure the datasource manually through the UI.
# =============================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
