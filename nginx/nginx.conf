worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=shorten_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=redirect_limit:10m rate=100r/s;

    upstream url_shortener_app {
        server app:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost _;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/v1/urls {
            limit_req zone=shorten_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://url_shortener_app;
        }

        location ~ "^/[A-Za-z0-9_-]{3,20}$" {
            limit_req zone=redirect_limit burst=200 nodelay;
            limit_req_status 429;
            proxy_pass http://url_shortener_app;
            proxy_redirect off;
        }

        location /actuator {
            deny all;
            return 403;
        }

        location / {
            proxy_pass http://url_shortener_app;
        }
    }
}