# =============================================================
#  Docker Compose - Full Local Development Stack
#
#  Services:
#  - app         : URL Shortener Spring Boot application
#  - postgres    : PostgreSQL 16 database
#  - redis       : Redis 7 cache
#  - prometheus  : Metrics scraper
#  - grafana     : Metrics dashboard
#  - nginx       : Reverse proxy (SSL termination + routing)
#
#  Usage:
#    docker compose up -d              # start everything
#    docker compose logs -f app        # tail application logs
#    docker compose down -v            # stop and remove volumes
# =============================================================

services:

  # --- PostgreSQL ---------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - url-shortener-net

  # --- Redis --------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - url-shortener-net

  # --- Spring Boot Application ---------------------------------
  app:
    build:
      context: ./url-shortener
      dockerfile: Dockerfile
    container_name: url-shortener-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_BASE_URL: http://localhost:8081
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - url-shortener-net

  # --- Prometheus ----------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: url-shortener-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - url-shortener-net

  # --- Grafana -------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: url-shortener-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - url-shortener-net

  # --- NGINX ---------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: url-shortener-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - url-shortener-net

# --- Volumes --------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

# --- Network --------------------------------------------------
networks:
  url-shortener-net:
    driver: bridge
