# ============================================================
#  URL Shortener - Base Application Configuration
#  Profile-specific files (application-dev.properties,
#  application-prod.properties) override these values.
# ============================================================

spring.application.name=url-shortener

# Active profile (override via env var: SPRING_PROFILES_ACTIVE)
spring.profiles.active=dev

# ============================================================
#  Server
# ============================================================
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain

# ============================================================
#  JPA / Hibernate
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
#  Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
#  Cache
# ============================================================
spring.cache.type=redis

# ============================================================
#  Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

# ============================================================
#  Springdoc / Swagger UI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ============================================================
#  Application-specific
# ============================================================
# Base URL used when constructing short links returned to clients
app.base-url=http://localhost:8080
# Default TTL for shortened URLs in days (0 = never expires)
app.default-ttl-days=30
# Length of auto-generated short codes
app.short-code-length=7
# Redis TTL for cached redirects in seconds
app.cache.redirect-ttl-seconds=3600
