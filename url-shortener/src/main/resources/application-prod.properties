# ============================================================
#  URL Shortener - Production Profile
#  All sensitive values are injected via environment variables.
#  Never commit real credentials to source control.
# ============================================================

# ============================================================
#  DataSource
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP) - tuned for production load
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPool-Prod
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================================
#  JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ============================================================
#  Redis
# ============================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.max-active=30

# ============================================================
#  Application-specific
# ============================================================
app.base-url=${APP_BASE_URL}

# ============================================================
#  Actuator - restrict in production
# ============================================================
management.endpoints.web.exposure.include=health,prometheus

# ============================================================
#  Logging
# ============================================================
logging.level.com.abhay.url_shortener=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
# JSON structured logging is handled by the log appender in prod
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %logger{36} - %msg%n
