# =============================================================
#  GitHub Actions — CI/CD Pipeline
#
#  Triggers:
#  - Push to main           → full CI + build Docker image + deploy
#  - Push to any PR branch  → CI only (test + lint, no deploy)
#  - Manual dispatch        → full pipeline with environment selection
#
#  Pipeline stages:
#  1. test          — unit tests + controller tests (no Docker needed)
#  2. integration   — integration tests with Testcontainers (Docker needed)
#  3. build         — Maven package + Docker image build + push to GHCR
#  4. deploy-staging  — kubectl apply to staging namespace
#  5. deploy-prod     — kubectl apply to production (manual approval gate)
#
#  Secrets required (set in GitHub repo Settings → Secrets):
#  - GHCR_TOKEN          : GitHub personal access token with write:packages
#  - KUBE_CONFIG_STAGING : base64-encoded kubeconfig for staging cluster
#  - KUBE_CONFIG_PROD    : base64-encoded kubeconfig for production cluster
# =============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [ staging, production ]

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/url-shortener

jobs:

  # ─────────────────────────────────────────────────────────────
  #  Stage 1: Unit + Controller Tests (fast, no Docker)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Unit & Controller Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run unit and controller tests
        run: ./mvnw test -B
        working-directory: url-shortener

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: url-shortener/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: url-shortener/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #  Stage 2: Integration Tests (Testcontainers — needs Docker)
  # ─────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run integration tests
        run: ./mvnw verify -B -DskipUnitTests
        working-directory: url-shortener
        env:
          # Testcontainers reuses Docker daemon on the runner
          TESTCONTAINERS_REUSE_ENABLE: true

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: url-shortener/target/failsafe-reports/*.xml
          reporter: java-junit

  # ─────────────────────────────────────────────────────────────
  #  Stage 3: Build & Push Docker Image
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ test, integration-test ]
    # Only build on pushes to main/develop, not on PRs
    if: github.event_name != 'pull_request'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build application JAR
        run: ./mvnw package -DskipTests -B
        working-directory: url-shortener

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: url-shortener
          file: url-shortener/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ─────────────────────────────────────────────────────────────
  #  Stage 4: Deploy to Staging
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.your-domain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image tag in deployment
        run: |
          kubectl set image deployment/url-shortener \
            url-shortener=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            -n url-shortener

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/url-shortener \
            -n url-shortener \
            --timeout=5m

      - name: Verify deployment health
        run: |
          kubectl get pods -n url-shortener
          kubectl get deployment url-shortener -n url-shortener

  # ─────────────────────────────────────────────────────────────
  #  Stage 5: Deploy to Production (manual approval required)
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    # This environment requires manual approval in GitHub
    # Configure in: Settings → Environments → production → Required reviewers
    environment:
      name: production
      url: https://your-domain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/ -n url-shortener

      - name: Update image tag in deployment
        run: |
          kubectl set image deployment/url-shortener \
            url-shortener=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            -n url-shortener

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/url-shortener \
            -n url-shortener \
            --timeout=10m

          sleep 15
      - name: Smoke test production
        run: |
          curl -f https://your-domain.com/actuator/health | jq '.status'
