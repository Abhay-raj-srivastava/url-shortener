# =============================================================
#  Deployment — URL Shortener Application
#
#  Design decisions:
#  - replicas: 3 provides basic HA across node failures.
#  - RollingUpdate strategy ensures zero-downtime deploys:
#    at most 1 pod unavailable, at most 1 extra pod running.
#  - Resource requests/limits prevent noisy-neighbour problems.
#  - Liveness probe restarts pods that are deadlocked.
#  - Readiness probe removes pods from load balancing until
#    Spring Boot is fully initialised (including Flyway migration).
#  - Startup probe gives the app 3 minutes to start before
#    liveness kicks in — avoids false restarts during cold starts.
#  - envFrom loads non-sensitive config from ConfigMap and
#    sensitive values from Secret cleanly without listing each key.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: url-shortener
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: url-shortener
        app.kubernetes.io/name: url-shortener
      annotations:
        # Prometheus auto-discovery annotations
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      # Spread pods across nodes for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: url-shortener

      # Security context — run as non-root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: url-shortener
          image: your-registry/url-shortener:latest   # replace with your image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          # Load all ConfigMap keys as env vars
          envFrom:
            - configMapRef:
                name: url-shortener-config
            - secretRef:
                name: url-shortener-secret

          # Resource boundaries
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          # Startup probe — allows up to 3 min for startup
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 18
            periodSeconds: 10

          # Liveness probe — restarts deadlocked pods
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          # Readiness probe — removes pod from service until ready
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          # Container security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Writable temp directory (needed by Spring Boot)
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp

      volumes:
        - name: tmp-dir
          emptyDir: {}

      # Graceful shutdown — wait up to 60s for in-flight requests
      terminationGracePeriodSeconds: 60
